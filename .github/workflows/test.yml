name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install html5lib

      - name: Parser conformance suite (117 vectors)
        run: python3 parser.py --self-test

      - name: Reference oracle malformed vectors (10 vectors)
        run: python3 html5lib_reference.py --self-test

      - name: Differential validation (34 cases)
        run: python3 html5lib_reference.py --differential

      - name: Smoke test server startup
        run: |
          timeout 5 python3 server.py --port 18080 --secret test-secret || true